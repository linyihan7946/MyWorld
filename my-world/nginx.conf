server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 部署网关会保留 /my-world/ 前缀；在容器内将它映射回 dist 根目录。
    location = /my-world {
        return 301 /my-world/;
    }

    location = /my-world/ {
        try_files /index.html =404;
    }

    # 静态资源长期缓存（Vite 构建带 hash）
    location ^~ /my-world/assets/ {
        rewrite ^/my-world/(.*)$ /$1 break;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 支持 /my-world/ 下的 SPA 路由刷新。
    location ^~ /my-world/ {
        rewrite ^/my-world/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # 同时保留容器根路径访问，方便本地 Docker 调试。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
